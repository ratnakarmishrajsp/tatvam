name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  inject-secrets:
    runs-on: ubuntu-latest
    name: Upload config.secret.php via SFTP

    steps:
      - name: Generate config.secret.php
        env:
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          CASHFREE_ENV: ${{ secrets.CASHFREE_ENV }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
          META_CAPI_TEST_CODE: ${{ secrets.META_CAPI_TEST_CODE }}
        run: |
          cat > config.secret.php << PHPEOF
          <?php
          /**
           * TATVAM - Secret Credentials (Auto-generated by GitHub Actions)
           * DO NOT edit manually on server — update GitHub Secrets instead.
           */
          define('CASHFREE_APP_ID', '${CASHFREE_APP_ID}');
          define('CASHFREE_SECRET_KEY', '${CASHFREE_SECRET_KEY}');
          define('CASHFREE_ENV', '${CASHFREE_ENV}');
          define('SMTP_HOST', '${SMTP_HOST}');
          define('SMTP_PORT', ${SMTP_PORT});
          define('SMTP_SECURE', '${SMTP_SECURE}');
          define('SMTP_USER', '${SMTP_USER}');
          define('SMTP_PASS', '${SMTP_PASS}');
          define('SMTP_FROM_NAME', 'TATVAM Support Desk');
          define('META_PIXEL_ID', '${META_PIXEL_ID}');
          define('META_CAPI_ACCESS_TOKEN', '${META_CAPI_ACCESS_TOKEN}');
          define('META_CAPI_TEST_CODE', '${META_CAPI_TEST_CODE}');
          PHPEOF
          echo "Generated config.secret.php:"
          head -5 config.secret.php

      - name: Install paramiko
        run: pip install paramiko

      - name: Upload via Python SFTP (paramiko)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          python3 << 'PYEOF'
          import paramiko
          import os

          host      = os.environ['SSH_HOST']
          username  = os.environ['SSH_USER']
          password  = os.environ['SSH_PASS']
          port      = int(os.environ['SSH_PORT'])
          remote    = os.environ['DEPLOY_PATH'] + '/config.secret.php'
          local     = './config.secret.php'

          print(f"Connecting to {host}:{port} as {username}...")

          transport = paramiko.Transport((host, port))
          transport.connect(username=username, password=password)

          sftp = paramiko.SFTPClient.from_transport(transport)

          print(f"Uploading {local} → {remote}")
          sftp.put(local, remote)

          sftp.close()
          transport.close()

          print("✅ config.secret.php uploaded successfully!")
          PYEOF
