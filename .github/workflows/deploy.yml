name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: SSH Deploy + Inject Secrets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Pull latest code from GitHub
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main

            # 2. Generate config.secret.php from GitHub Secrets
            cat > ${{ secrets.DEPLOY_PATH }}/config.secret.php << 'SECRETEOF'
            <?php
            /**
             * TATVAM - Secret Credentials (Auto-generated by GitHub Actions)
             * DO NOT edit manually on server — update GitHub Secrets instead.
             */

            // Cashfree Payment Gateway
            define('CASHFREE_APP_ID', '${{ secrets.CASHFREE_APP_ID }}');
            define('CASHFREE_SECRET_KEY', '${{ secrets.CASHFREE_SECRET_KEY }}');
            define('CASHFREE_ENV', '${{ secrets.CASHFREE_ENV }}');

            // SMTP Credentials
            define('SMTP_HOST', '${{ secrets.SMTP_HOST }}');
            define('SMTP_PORT', ${{ secrets.SMTP_PORT }});
            define('SMTP_SECURE', '${{ secrets.SMTP_SECURE }}');
            define('SMTP_USER', '${{ secrets.SMTP_USER }}');
            define('SMTP_PASS', '${{ secrets.SMTP_PASS }}');
            define('SMTP_FROM_NAME', 'TATVAM Support Desk');

            // Meta Pixel & CAPI
            define('META_PIXEL_ID', '${{ secrets.META_PIXEL_ID }}');
            define('META_CAPI_ACCESS_TOKEN', '${{ secrets.META_CAPI_ACCESS_TOKEN }}');
            define('META_CAPI_TEST_CODE', '${{ secrets.META_CAPI_TEST_CODE }}');
            SECRETEOF

            echo "✅ Deployment complete. config.secret.php injected."
